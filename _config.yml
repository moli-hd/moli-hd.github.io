title: Moli's Naive Stories
description: A Naive Blog
url: "https://moli-hd.github.io"
baseurl: ""
lang: zh-CN

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:year:month:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

kramdown:
  input: GFM

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
