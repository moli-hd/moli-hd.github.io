---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%-d %B %Y" }}</div>
    {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  {% if page.tags %}
  <div class="post-tags">
    {% for tag in page.tags %}<span>#{{ tag }}</span>{% endfor %}
  </div>
  {% endif %}
</article>
