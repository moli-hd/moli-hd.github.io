---
layout: default
---
{{ content }}

{% for post in site.posts limit:5 %}
  <div class="latest-post">
    <h3>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h3>
    <div class="post-meta">
      {{ post.date | date: "%B %-d, %Y" }}
    </div>
    {% if post.description %}
      <p>{{ post.description }}</p>
    {% endif %}
  </div>
{% endfor %}
